[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shanghai-livability-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.121",
  "uvicorn>=0.38",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyproj>=3.6",
  "pyshp>=3.0",
  "scipy>=1.11",
  "sqlalchemy>=2.0",
  "python-dotenv>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
livability-api = "app.main:main"
livability-ingest = "app.process_data:main"

[tool.setuptools]
packages = ["app"]
